name: Daily contribution

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      date:
        description: Optional Chicago date in YYYY-MM-DD form
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-contribution-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Resolve the Chicago date
        id: daily-date
        shell: bash
        run: |
          DATE='${{ inputs.date }}'
          if [ -z "$DATE" ]; then
            DATE="$(TZ=America/Chicago date +%F)"
          fi
          echo "value=$DATE" >> "$GITHUB_OUTPUT"

      - name: Generate daily content
        id: generate
        continue-on-error: true
        run: npm run generate -- "${{ steps.daily-date.outputs.value }}"

      - name: Record an emergency heartbeat
        if: steps.generate.outcome == 'failure'
        continue-on-error: true
        run: |
          echo 'Normal generation failed; recording an emergency heartbeat.'
          npm run generate:emergency -- "${{ steps.daily-date.outputs.value }}"

      - name: Alert on persistent provider outages
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r PROVIDER STREAK FAILURE_DATE; do
            [ -n "$PROVIDER" ] || continue
            TITLE="Provider outage: $PROVIDER"
            BODY="The $PROVIDER provider has failed for $STREAK consecutive Chicago dates. Latest failure: $FAILURE_DATE. Check the provider manually before closing this issue."
            ISSUE="$(gh issue list --state all --search "$TITLE in:title" --limit 1 --json number,state --jq '.[] | "\(.number)\t\(.state)"')"
            if [ -z "$ISSUE" ]; then
              gh issue create --title "$TITLE" --body "$BODY"
            else
              IFS=$'\t' read -r NUMBER STATE <<< "$ISSUE"
              if [ "$STATE" = closed ]; then
                gh issue reopen "$NUMBER" --comment "$BODY"
              fi
            fi
            node scripts/ack-provider-health-alert.js "$PROVIDER"
          done < <(node scripts/provider-health-alerts.js)

      - name: Configure commit identity
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        shell: bash
        run: |
          if [ -z "$COMMIT_NAME" ] || [ -z "$COMMIT_EMAIL" ]; then
            echo 'Set repository variables COMMIT_NAME and COMMIT_EMAIL before enabling this workflow.' >&2
            exit 1
          fi
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"

      - name: Commit the daily update
        env:
          DATE: ${{ steps.daily-date.outputs.value }}
        shell: bash
        run: |
          git add -A -- README.md archive data
          git commit --allow-empty -m "daily: $DATE"

      - name: Push with one rebase retry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          for attempt in 1 2; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
          done
